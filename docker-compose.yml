
name: microservices-deployment

services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgresdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: exam123
      POSTGRES_DB: soa-skill-exam-2400032498
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d soa-skill-exam-2400032498"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  meeting-service:
    image: docker-skill-exam-2400032498:latest
    container_name: meeting-service
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "2498:8080"
    environment:
      DB_URL: jdbc:postgresql://postgresdb:5432/soa-skill-exam-2400032498
      DB_USERNAME: postgres
      DB_PASSWORD: exam123
    depends_on:
      postgresdb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - microservices-network

volumes:
  postgres_data:

networks:
  microservices-network:
    driver: bridge
